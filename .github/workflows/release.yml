name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The signing secrets live in this environment, which only v* tags may deploy to, so no other
    # workflow or branch can read the key. Actions are pinned by commit for the same reason.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # release-notes.sh walks back to the previous tag.
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # A tag that disagrees with gradle.properties would publish an APK whose versionCode
      # does not match its name.
      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^cellscope\.versionName=//p' gradle.properties)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match cellscope.versionName=${version}"; exit 1; }

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.CELLSCOPE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::CELLSCOPE_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the APK and the priv-app module
        env:
          CELLSCOPE_KEYSTORE: ${{ runner.temp }}/release.jks
          CELLSCOPE_KEYSTORE_PASSWORD: ${{ secrets.CELLSCOPE_KEYSTORE_PASSWORD }}
          CELLSCOPE_KEY_ALIAS: ${{ secrets.CELLSCOPE_KEY_ALIAS }}
          CELLSCOPE_KEY_PASSWORD: ${{ secrets.CELLSCOPE_KEY_PASSWORD }}
        run: ./make-module.sh --no-daemon

      # Fail rather than publish an APK signed by anything but the release key.
      - name: Verify the signing certificate
        env:
          EXPECTED_SHA256: ${{ vars.CELLSCOPE_CERT_SHA256 }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: //p' | head -1)
          echo "certificate SHA-256: $actual"
          test "$actual" = "$EXPECTED_SHA256" || { echo "::error::unexpected signing certificate"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "dist/cellscope-${GITHUB_REF_NAME}.apk"
          zip="dist/cellscope-privapp-${GITHUB_REF_NAME}.zip"
          ./release-notes.sh "$GITHUB_REF_NAME" > dist/changelog.md
          cat dist/changelog.md
          gh release create "$GITHUB_REF_NAME" --notes-file dist/changelog.md "dist/cellscope-${GITHUB_REF_NAME}.apk" "$zip"

          # KernelSU/Magisk poll releases/latest/download/update.json (the updateJson in module.prop),
          # so the newest release answers for every installed module. They render the changelog URL
          # as text, hence the notes as a Markdown asset rather than the HTML release page.
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          jq -n --arg version "$GITHUB_REF_NAME" \
            --argjson versionCode "$(unzip -p "$zip" module.prop | sed -n 's/^versionCode=//p')" \
            --arg zipUrl "$base/$(basename "$zip")" \
            --arg changelog "$base/changelog.md" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' > dist/update.json
          cat dist/update.json
          gh release upload "$GITHUB_REF_NAME" dist/changelog.md dist/update.json
      - run: rm -f "$RUNNER_TEMP/release.jks"
        if: always()
